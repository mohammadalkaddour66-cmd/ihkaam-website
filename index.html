<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- أيقونات التبويب — مولّدة من public/ihkaam-logo.png عبر
         scripts/make-favicon.mjs. لا تُحرَّر يدوياً؛ أعد تشغيل السكربت.
         كان هنا favicon.svg: شعارٌ بنفسجيّ موروثٌ من قالبٍ جاهز. -->
    <link rel="icon" type="image/png" sizes="32x32"   href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   
    <meta name="keywords" content="إدارة مركز تحفيظ القرآن, برنامج مدرسة قرآنية, نظام إدارة حلقات القرآن, متابعة طلاب التحفيظ, تسجيل حضور حلقة قرآن" />
    <meta property="og:title" content="إحكام — نظام إدارة المعاهد القرآنية" />
    
    <meta property="og:type" content="website" />
    <!-- Facebook/Twitter/WhatsApp resolve these against their own host, not ours,
         so a relative path yields no preview image at all. Must stay absolute. -->
    <meta property="og:image" content="https://ihkaam.app/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://ihkaam.app/" />
    <meta property="og:site_name" content="إحكام" />
    <meta property="og:locale" content="ar_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ihkaam.app/og-cover.jpg" />
    <title>إحكام — نظام إدارة المعاهد القرآنية</title>
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- الهيرو يقرأ صوره وإحصائياته من Supabase قبل أن يرسم شيئاً، فالـ DNS/TLS
         نحوه على المسار الحرج. preconnect يدفع الرحلتين قبل أن يُقلع الـ JS. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- ملف متغيّر واحد (300..900) بدل ستة ملفات ثابتة. المكسب مزدوج: طلب واحد
         بدل أربعة أو خمسة، و font-weight:600 — المستعمَل 123 مرة — كان خارج
         القائمة الثابتة فيُصنَّع تصنيعاً؛ الآن له وزن حقيقي.
         التحميل غير حاجب: preload ثم media=print يتحول إلى all عند الجهوز. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300..900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300..900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300..900&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
