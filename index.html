<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- أيقونات التبويب — مولّدة من public/ihkaam-logo.png عبر
         scripts/make-favicon.mjs. لا تُحرَّر يدوياً؛ أعد تشغيل السكربت.
         كان هنا favicon.svg: شعارٌ بنفسجيّ موروثٌ من قالبٍ جاهز.

         و favicon.ico ليس تكراراً للـPNG: زاحفُ أيقونات جوجل يطلب
         /favicon.ico من الجذر أولاً مهما أعلنّا هنا. و_redirects يردّ
         `/*  /index.html  200`، فكان الزاحف يستلم صفحةَ HTML بحالة
         نجاح — لا 404 يدفعه للبديل — فيفشل صامتاً ويُبقي البنفسجيَّ
         القديم في فهرسه. وجودُ الملف فعلياً يقطع هذا المسار. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32"   href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F5EC" />

    <!-- وسوم الصفحة الرئيسية، وهي القالب الذي يبني منه scripts/prerender.mjs كل مسار:
         يُنزع منه العنوان والوصف والرابط المعياري ووسوم og/twitter ويُكتب بدلها ما يخصّ
         المسار (من src/config/seo.js ومن بيانات المقالات والميزات والمساعدة). فما يبقى
         هنا لكل الصفحات: الأيقونات، والمخطط العام للمنظمة والموقع، ووسوم الموقع الثابتة.
         لا أرقام إحصائية في أي وصف: عدد المعاهد يُعرض من get_public_landing_stats وحده. -->
    <meta name="description" content="نظام عربي يُدير مركز التحفيظ كاملاً: التسميع والحضور والأقساط والتقارير في مكان واحد، وبوابة يتابع فيها ولي الأمر ابنه أولاً بأول. اطلب تجربة مجانية." />
    <link rel="canonical" href="https://ihkaam.app/" />

    <meta property="og:title" content="إحكام — نظام إدارة المعاهد والحلقات القرآنية" />
    <meta property="og:description" content="التسميع والحضور والأقساط والتقارير في نظام واحد، وبوابة يتابع فيها ولي الأمر ابنه أولاً بأول." />
    <meta property="og:type" content="website" />
    <!-- Facebook/Twitter/WhatsApp resolve these against their own host, not ours,
         so a relative path yields no preview image at all. Must stay absolute. -->
    <meta property="og:image" content="https://ihkaam.app/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="منصة إحكام — لوحة إدارة معهد قرآني" />
    <meta property="og:url" content="https://ihkaam.app/" />
    <meta property="og:site_name" content="إحكام" />
    <meta property="og:locale" content="ar_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="إحكام — نظام إدارة المعاهد والحلقات القرآنية" />
    <meta name="twitter:description" content="التسميع والحضور والأقساط والتقارير في نظام واحد، وبوابة يتابع فيها ولي الأمر ابنه أولاً بأول." />
    <meta name="twitter:image" content="https://ihkaam.app/og-cover.jpg" />
    <title>إحكام — نظام إدارة المعاهد والحلقات القرآنية</title>
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- بياناتٌ منظَّمة. لا aggregateRating ولا تسعيرٌ هنا: كلاهما يُعرَض

         مطابقٍ لما تراه العين على الصفحة — وإلا فهي مخالفةٌ صريحة
         لسياسة البيانات المنظَّمة، عقوبتها إسقاط الموقع من المزايا. -->

          "founder": {
            "@type": "Person",
            "@id": "https://ihkaam.app/about#founder",
            "name": "محمد القدور",
            "alternateName": "Mohammad Alkaddour",
            "jobTitle": "مؤسس منصة إحكام",
            "image": "https://ihkaam.app/about/mohammad-alkaddour.webp",
            "url": "https://ihkaam.app/about"
          },
          "sameAs": [
            "https://www.youtube.com/@ihkaam_app",

          ],

          }
        },
        {
          "@type": "WebSite",

        {
          "@type": "SoftwareApplication",
          "@id": "https://ihkaam.app/ihkaam#software",

          "url": "https://ihkaam.app/ihkaam",
          "inLanguage": "ar",
          "description": "نظام لإدارة مراكز تحفيظ القرآن: الحلقات والطلاب، وتسجيل التسميع والحضور، والأقساط، والتقارير، وبوابة ولي الأمر.",

    <!-- صور الهيرو تأتي من تخزين Supabase، ورابط الأولى مكتوب في HTML المُصيَّر مسبقاً
         مع preload (scripts/prerender.mjs). الصور طلبات بلا CORS والبيانات طلبات CORS،
         والمتصفح يفتح لكلٍّ منهما اتصالاً مستقلاً، فيُفتح الاثنان مبكراً. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />

    <!-- خط قمرة من الموقع نفسه (ISS-29): @font-face في src/index.css والملفات في
         public/fonts. الجزء العربي يُحمَّل مسبقاً لأنه أول ما يُرسم. -->
    <link rel="preload" href="/fonts/qomra-bold.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
