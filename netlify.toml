# ─────────────────────────────────────────────────────────────
# الموقع يُنشر على Cloudflare Pages (النطاق ihkaam.app)، وهذا الملف باقٍ
# ليبني Netlify النسخة نفسها إن رُبط المستودع به يوماً.
#
# لا ترويسات ولا تحويلات هنا:
#   • الترويسات في public/_headers، و Netlify يقرؤه كما يقرؤه Cloudflare.
#     كانت منسوخةً هنا أيضاً، فتتباعد النسختان عند أول تعديل.
#   • قاعدة «/* ← /index.html 200» حُذفت (ISS-03). الصفحات ملفاتٌ حقيقية
#     يكتبها scripts/prerender.mjs، و Netlify يخدم dist/404.html بحالة 404
#     لكل رابطٍ لا ملف له، دون أيّ إعداد.
# ─────────────────────────────────────────────────────────────
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # scripts/prerender.mjs يستعمل import.meta.dirname (Node 20.11 فما فوق)
  NODE_VERSION = "22"
